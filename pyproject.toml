[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "methanewatch"
version = "0.2.0"
description = "Permian Basin methane from Sentinel-5P TROPOMI compared with EPA GHGRP Subpart W reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chandra Prakash Choudhary" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "netCDF4>=1.6",
  "requests>=2.31",
  "libpysal>=4.9",
  "esda>=2.5",
  "spreg>=1.4",
]

[project.scripts]
methane = "methane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
methane = ["site_template.html", "site.css", "site.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]
